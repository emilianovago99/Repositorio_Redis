global
    log /dev/log    local0
    log /dev/log    local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend redis_writes
    bind *:6380
    default_backend redis_master

frontend redis_reads
    bind *:6381
    default_backend redis_replicas

backend redis_master
    mode tcp
    balance first
    option tcp-check
    tcp-check send AUTH\ Secreta123\r\n
    tcp-check expect string +OK
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server redis1 10.0.0.129:6379 check inter 2s fall 3 rise 2
    server redis2 10.0.0.204:6379 check inter 2s fall 3 rise 2 
    server redis3 10.0.0.248:6379 check inter 2s fall 3 rise 2

backend redis_replicas
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check send AUTH\ Secreta123\r\n
    tcp-check expect string +OK
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:slave
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server redis1 10.0.0.129:6379 check inter 2s fall 3 rise 2
    server redis2 10.0.0.204:6379 check inter 2s fall 3 rise 2 
    server redis3 10.0.0.248:6379 check inter 2s fall 3 rise 2